<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공지사항 - 무림</title><style>
@import url('https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Serif+KR:wght@400;600;700&family=Ma+Shan+Zheng&display=swap');
:root{--bg:#0A0806;--panel:#120E0A;--gold:#E2C27A;--gold2:#C9A962;--text:#D8C7A0;--dim:#8E7E5C;--line:rgba(201,169,98,.22);--red:#9C1A12}
*{box-sizing:border-box}
html{scrollbar-color:#8C6A2A #0E0B07}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:#0E0B07}::-webkit-scrollbar-thumb{background:#5A4520;border:2px solid #0E0B07}::-webkit-scrollbar-thumb:hover{background:#8C6A2A}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,#1A140D,var(--bg) 60%) fixed,var(--bg);color:var(--text);font-family:'Noto Serif KR',Batang,serif;font-size:16px;line-height:1.85}
a{color:var(--gold)}a:hover{color:#FFF0C8}
.top{position:relative;height:220px;background:url(../assets/banner.png) center/cover;border-bottom:1px solid var(--line)}
.top.list{background-image:url(../assets/banner.png)}
.top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,8,6,0) 50%,var(--bg))}
.wrap{max-width:820px;margin:0 auto;padding:0 20px 60px}
.card{position:relative;margin-top:-40px;background:linear-gradient(180deg,rgba(24,19,13,.96),rgba(14,11,8,.96));border:1px solid var(--line);padding:34px 40px 40px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.card::before,.card::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--gold2)}
.card::before{left:-1px;top:-1px;border-right:0;border-bottom:0}.card::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.meta{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--dim);letter-spacing:1px}
.tag{color:#1A1006;background:linear-gradient(180deg,#EBCF86,#C79A45);padding:1px 10px;font-weight:700;letter-spacing:2px}
h1{font-family:'Song Myung',serif;font-weight:400;font-size:34px;line-height:1.35;margin:14px 0 22px;color:#F3E2B6;letter-spacing:1px}
h2{font-family:'Song Myung',serif;font-weight:400;font-size:22px;color:var(--gold);margin:34px 0 10px;display:flex;align-items:center;gap:12px}
h2::before{content:"◆";font-size:11px;color:var(--gold2)}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
p{margin:0 0 16px}
ul{margin:0 0 16px;padding-left:20px}li{margin:4px 0}li::marker{color:var(--gold2)}
.note{border:1px solid rgba(226,194,122,.6);background:rgba(226,194,122,.07);padding:14px 18px;margin:18px 0;color:#F3E2B6;position:relative}
.note::before{content:"";position:absolute;inset:3px;border:1px solid rgba(226,194,122,.18);pointer-events:none}
figure{margin:22px 0}
figure img{display:block;max-width:100%;height:auto;margin:0 auto;border:1px solid rgba(226,194,122,.45);box-shadow:0 8px 24px rgba(0,0,0,.6)}
figcaption{text-align:center;font-size:13px;color:var(--dim);margin-top:8px}
.foot{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:13px;color:var(--dim)}
.seal{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;background:var(--red);color:#F5DFAE;font-family:'Ma Shan Zheng',serif;font-size:14px;box-shadow:inset 0 0 0 1px var(--gold);margin-right:8px;vertical-align:-3px}
.rows a{display:flex;gap:14px;align-items:baseline;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--text)}
.rows a:hover{background:rgba(226,194,122,.06)}
.rows .t{flex:1;color:#EADBB6}.rows .d{color:var(--dim);font-size:13px;white-space:nowrap}
.rows a:first-child .t{color:#F3E2B6;font-weight:700}
@media(max-width:600px){.top{height:140px}.card{padding:24px 20px 28px;margin-top:-24px}h1{font-size:26px}body{font-size:15px}}
</style></head><body><div class="top list"></div><div class="wrap"><div class="card"><div class="meta"><span class="seal">千</span><span>무림</span></div><h1>공지사항</h1><div class="rows"><a href="20261117-launcher10/"><span class="tag">공지</span><span class="t">무림 1.0 정식 접속기 안내</span><span class="d">2026.11.17</span></a></div></div></div></body></html>
